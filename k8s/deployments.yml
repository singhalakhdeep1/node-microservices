# Application workloads: API gateway, 4 microservices, frontend.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
  labels: { app: user-service, part-of: node-microservices }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service, part-of: node-microservices }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: user-service
        image: ghcr.io/singhalakhdeep1/node-microservices/user-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef: { name: nms-config }
        - secretRef: { name: nms-secrets }
        env:
        - name: PORT
          value: "3001"
        - name: SERVICE_ADDRESS
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - name: MONGO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: nms-secrets, key: MONGO_ROOT_PASSWORD } }
        - name: MONGODB_URI
          value: mongodb://admin:$(MONGO_ROOT_PASSWORD)@mongodb:27017/users?authSource=admin
        readinessProbe:
          httpGet: { path: /health, port: 3001 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /metrics, port: 3001 }
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 384Mi }
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservices
spec:
  selector: { app: user-service }
  ports:
  - port: 3001
    targetPort: 3001
---
