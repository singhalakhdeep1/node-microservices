apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
      - name: frontend
        image: ghcr.io/singhalakhdeep1/node-microservices/frontend:latest
        ports:
        - containerPort: 3005
        readinessProbe:
          httpGet: { path: /, port: 3005 }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: microservices
spec:
  selector: { app: frontend }
  ports:
