# Edge routing through the Traefik ingress controller (helm install traefik traefik/traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-microservices
  namespace: microservices
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /health
        pathType: Exact
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /
        pathType: Prefix
        backend:
          service: { name: frontend, port: { number: 3005 } }
---
# Pods only accept traffic from inside the namespace (and the ingress controller for the edge services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-only
  namespace: microservices
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
