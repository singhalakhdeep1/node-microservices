version: '3.8'

# CURRICULUM COVERAGE:
# #1201-1250: Microservices Architecture - Service separation, communication
# #1851-1900: Docker Containerization - Multi-container orchestration
# #1901-1950: Service Discovery, Load Balancing

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: microservices-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-network

  # RabbitMQ Message Broker - #1251-1275: Message Queue Communication
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: microservices-rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    networks:
      - microservices-network

  # Redis Cache - #1276-1290: Distributed Caching
  redis:
    image: redis:7-alpine
    container_name: microservices-redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network

  # User Service - #1201-1220: User Management Microservice
  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/users?authSource=admin
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: microservices-jwt-secret-key
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - microservices-network
    restart: unless-stopped

  # Product Service - #1221-1240: Product Catalog Microservice
  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/products?authSource=admin
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    networks:
      - microservices-network
    restart: unless-stopped

  # Order Service - #1241-1260: Order Management Microservice
  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/orders?authSource=admin
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - mongodb
      - rabbitmq
      - redis
      - user-service
      - product-service
    networks:
      - microservices-network
    restart: unless-stopped

  # Notification Service - #1261-1275: Notification/Email Microservice
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      RABBITMQ_URL: amqp://admin:password123@rabbitmq:5672
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASS: your-app-password
    depends_on:
      - rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped

  # API Gateway - #1291-1310: API Gateway Pattern, Request Routing
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
    depends_on:
      - user-service
      - product-service
      - order-service
      - notification-service
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  mongodb_data:
