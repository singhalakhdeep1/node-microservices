name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build backend workspaces (shared, 4 services, gateway)
        run: npm run build
      - name: Build frontend
        run: npm run build:frontend
      - name: Typecheck everything (after next build generates next-env.d.ts)
        run: npm run typecheck
      - name: Validate compose file
        run: docker compose config -q

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api-gateway, dockerfile: api-gateway/Dockerfile }
          - { name: user-service, dockerfile: services/user-service/Dockerfile }
          - { name: product-service, dockerfile: services/product-service/Dockerfile }
          - { name: order-service, dockerfile: services/order-service/Dockerfile }
          - { name: notification-service, dockerfile: services/notification-service/Dockerfile }
          - { name: frontend, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest,ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
