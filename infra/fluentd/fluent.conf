# Receives structured logs from every service (fluent-logger, forward protocol) and writes them to
# stdout plus daily files. Swap the <match> for Elasticsearch/S3 output plugins in production.
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match nms.**>
  @type copy
  <store>
    @type stdout
  </store>
  <store>
    @type file
    path /fluentd/log/nms.%Y%m%d
    append true
    <buffer time>
      timekey 1d
      timekey_wait 1m
      flush_interval 10s
    </buffer>
  </store>
</match>
